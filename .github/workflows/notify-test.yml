name: notify-test
on: { workflow_dispatch: }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_SITE_BASE: ${{ secrets.WATCH_SITE_BASE }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from watchmon.notify import NtfyNotifier, ntfy_topic
          print('topic configured:', bool(ntfy_topic()))
          ok = NtfyNotifier().send('☁️ Cloud monitor is live',
                                   'Test push from GitHub Actions. Alerts will arrive this way.')
          print('delivered:', ok)
          sys.exit(0 if ok else 1)"
